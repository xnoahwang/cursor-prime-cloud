name: upstream-drift

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

jobs:
  integrity:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendored payload matches UPSTREAM.lock
        run: bash scripts/check-upstream.sh

  freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock matches cursor-prime default branch
        run: bash scripts/check-upstream.sh --freshness
